<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="SkySoft Weather home screen">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="900" height="560" fill="url(#bg)"/>
  <circle cx="750" cy="90" r="40" fill="#fbbf24" opacity="0.9"/>
  <ellipse cx="200" cy="120" rx="70" ry="25" fill="white" opacity="0.5"/>
  <text x="40" y="50" fill="white" font-family="Arial,sans-serif" font-size="22" font-weight="bold">SkySoft Weather</text>
  <rect x="40" y="80" width="820" height="52" rx="26" fill="white" opacity="0.9"/>
